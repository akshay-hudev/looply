services:
  - type: web
    name: looply-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: looply-db
          property: connectionString
      - key: USE_WORKER
        value: "false"
      - key: PUBLIC_BASE_URL
        value: "https://looply-backend.onrender.com"
      - key: FRONTEND_URL
        value: "https://looply-frontend.vercel.app"
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: looply-db
    plan: free
